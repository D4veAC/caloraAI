<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calora — Catering Operations</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <main class="admin-shell">
    <header class="admin-head">
      <div><p class="dash-card-label">Calora operations</p><h1 class="editorial">Tomorrow's Kitchen</h1></div>
      <a class="btn btn-ghost" href="/">User app</a>
    </header>

    <form id="admin-login" class="admin-login">
      <h2>Admin sign in</h2>
      <label for="admin-name">Username</label><input id="admin-name" autocomplete="username" required>
      <label for="admin-password">Password</label><input id="admin-password" type="password" autocomplete="current-password" required>
      <button class="btn btn-fill" type="submit">Sign in</button>
      <p id="admin-login-error" role="alert"></p>
    </form>

    <section id="admin-content" hidden>
      <div class="admin-metrics" id="admin-metrics"></div>
      <div class="admin-table-wrap">
        <table>
          <thead><tr><th>User</th><th>Target</th><th>Catering</th><th>Lunch</th><th>Dinner</th><th>Adjustment</th><th>Status</th></tr></thead>
          <tbody id="admin-plan-rows"></tbody>
        </table>
      </div>
      <p class="admin-note">This operational view intentionally excludes raw third-party activity data.</p>
    </section>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
